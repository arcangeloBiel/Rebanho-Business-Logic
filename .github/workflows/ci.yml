name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM, Android e servidor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes (core, data, shared) e servidor
        run: ./gradlew allTests :server:test --stacktrace

      - name: Build do app Android
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace

  banco:
    name: Banco (Supabase local, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir o Postgres do Supabase e aplicar as migrations
        run: supabase db start

      - name: Testes do banco (pgTAP)
        run: supabase test db

  ios:
    name: iOS (simulador)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes iOS
        run: ./gradlew iosSimulatorArm64Test --stacktrace
