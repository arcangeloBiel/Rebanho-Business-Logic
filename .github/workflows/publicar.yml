name: Publicar biblioteca

# Publica core e data no GitHub Packages para o app em Compose Multiplatform.
# Dispare criando uma tag: git tag v1.0.0 && git push origin v1.0.0
#
# Supabase: se os segredos REBANHO_SUPABASE_URL e REBANHO_SUPABASE_CHAVE estiverem cadastrados
# no Environment "producao", a versão sai apontando para eles; senão, usa o projeto de
# desenvolvimento do gradle.properties (e o log avisa).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 1.0.0-dev.1)"
        required: true

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Testar e publicar (Android, iOS e JVM)
    runs-on: macos-latest # o iOS só compila em macOS
    timeout-minutes: 60
    environment: producao
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Definir a versão
        id: versao
        env:
          ENTRADA: ${{ inputs.versao }}
        run: |
          if [ -n "$ENTRADA" ]; then V="$ENTRADA"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "valor=$V" >> "$GITHUB_OUTPUT"
          echo "Publicando a versão $V"

      - name: Conferir o Supabase usado
        env:
          REBANHO_SUPABASE_URL: ${{ secrets.REBANHO_SUPABASE_URL }}
        run: |
          if [ -n "$REBANHO_SUPABASE_URL" ]; then
            echo "Supabase: $REBANHO_SUPABASE_URL (segredo do Environment producao)"
          else
            echo "::warning::Sem segredos de produção: esta versão aponta para o Supabase de desenvolvimento (gradle.properties)."
          fi

      - name: Testes
        run: ./gradlew allTests --stacktrace

      - name: Publicar no GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBANHO_SUPABASE_URL: ${{ secrets.REBANHO_SUPABASE_URL }}
          REBANHO_SUPABASE_CHAVE: ${{ secrets.REBANHO_SUPABASE_CHAVE }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Prebanho.versao=${{ steps.versao.outputs.valor }} --stacktrace
