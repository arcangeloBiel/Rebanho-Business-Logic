name: Deploy do banco

# Aplica as migrations de supabase/migrations no projeto Supabase de desenvolvimento.
# Roda só depois do merge (nunca em PR) e usa segredos do Environment "desenvolvimento".
#
# Configurar em Settings > Environments > desenvolvimento:
#   Secret   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com > Account > Access Tokens)
#   Secret   SUPABASE_DB_PASSWORD   senha do banco do projeto
#   Variable SUPABASE_PROJECT_ID    ref do projeto (ex.: tpkzynnxyibmzzrdijcf)
#
# Produção: criar o Environment "producao" com aprovação obrigatória e um job igual
# disparado pela branch main.

on:
  push:
    branches: [feature/supabase]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-banco-desenvolvimento
  cancel-in-progress: false

jobs:
  migrations:
    name: Migrations no Supabase (desenvolvimento)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desenvolvimento
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir se os segredos estão configurados
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Segredos do Environment 'desenvolvimento' não configurados. Deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ok == 'true'
        with:
          version: latest

      - name: Ligar ao projeto
        if: steps.config.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mostrar as migrations pendentes
        if: steps.config.outputs.ok == 'true'
        run: supabase migration list

      - name: Aplicar as migrations
        if: steps.config.outputs.ok == 'true'
        run: supabase db push
