name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM e Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes (core e data)
        run: ./gradlew allTests --stacktrace

  banco:
    name: Banco (Supabase local, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0

      - name: Subir o Postgres do Supabase e aplicar as migrations
        run: supabase db start

      - name: Testes do banco (pgTAP)
        run: supabase test db

  ios:
    name: iOS (simulador)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes iOS
        run: ./gradlew iosSimulatorArm64Test --stacktrace

      # Confere que a publicação para o app CMP sai completa (Android, iOS e JVM), sem publicar nada.
      - name: Publicação local (core e data)
        run: |
          ./gradlew publishToMavenLocal -Prebanho.versao=0.0.0-ci --stacktrace
          ls ~/.m2/repository/com/jakatech/rebanhomais/
